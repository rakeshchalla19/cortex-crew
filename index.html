<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrishyaMitra – Photo Management</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        transition: 0.3s;
    }

    .dark {
        background: #121212;
        color: white;
    }

    header {
        background: #1e3a8a;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        padding: 20px;
        text-align: center;
    }

    input[type="file"], input[type="text"] {
        padding: 8px;
        margin: 10px;
    }

    button {
        padding: 8px 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }

    .card {
        background: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .dark .card {
        background: #1e1e1e;
    }

    .card img {
        width: 100%;
        border-radius: 8px;
    }

    .favorite {
        color: red;
        font-size: 18px;
        cursor: pointer;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
    }

    .modal img {
        max-width: 80%;
        max-height: 80%;
        border-radius: 10px;
    }

    .modal-content {
        text-align: center;
        color: white;
    }

</style>
</head>

<body>

<header>
    <h1>📸 DrishyaMitra</h1>
    <p>Intelligent Photo Management Assistant</p>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
</header>

<div class="container">
    <input type="file" id="fileInput" multiple accept="image/*">
    <button onclick="uploadImages()">Upload</button>
    <br>
    <input type="text" id="searchInput" placeholder="Search images..." onkeyup="searchImages()">
</div>

<div class="gallery" id="gallery"></div>

<!-- Modal -->
<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-content">
        <img id="modalImage">
        <p id="modalInfo"></p>
    </div>
</div>

<script>

let images = JSON.parse(localStorage.getItem("images")) || [];

function saveToStorage() {
    localStorage.setItem("images", JSON.stringify(images));
}

function uploadImages() {
    const files = document.getElementById("fileInput").files;

    for (let file of files) {
        const reader = new FileReader();

        reader.onload = function(e) {
            const imageObj = {
                id: Date.now() + Math.random(),
                name: file.name,
                url: e.target.result,
                size: (file.size / 1024).toFixed(2) + " KB",
                date: new Date().toLocaleString(),
                favorite: false
            };

            images.push(imageObj);
            saveToStorage();
            renderGallery();
        };

        reader.readAsDataURL(file);
    }
}

function renderGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    images.forEach(img => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${img.url}" onclick="openModal('${img.url}','${img.name}','${img.size}','${img.date}')">
            <p>${img.name}</p>
            <p>${img.date}</p>
            <span class="favorite" onclick="toggleFavorite(${img.id})">
                ${img.favorite ? "❤️" : "🤍"}
            </span>
            <br>
            <button onclick="deleteImage(${img.id})">Delete</button>
        `;

        gallery.appendChild(card);
    });
}

function deleteImage(id) {
    images = images.filter(img => img.id !== id);
    saveToStorage();
    renderGallery();
}

function toggleFavorite(id) {
    images = images.map(img =>
        img.id === id ? {...img, favorite: !img.favorite} : img
    );
    saveToStorage();
    renderGallery();
}

function searchImages() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(search) ? "block" : "none";
    });
}

function openModal(url, name, size, date) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalImage").src = url;
    document.getElementById("modalInfo").innerText =
        `Name: ${name} | Size: ${size} | Uploaded: ${date}`;
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function toggleDarkMode() {
    document.body.classList.toggle("dark");
}

renderGallery();

</script>

</body>
</html>
